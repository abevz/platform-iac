- name: nightly shutdown suppresses availability alerts with failed scrapes
  interval: 1m
  input_series:
  - series: up{cluster="dev-lab-cluster",job="dev-lab-cluster-nodes",instance="node1:9100"}
    values: 0+0x120
  - series: node_boot_time_seconds{cluster="dev-lab-cluster",job="dev-lab-cluster-nodes",instance="node1:9100"}
    values: -3600+0x120
  - series: up{cluster="dev-lab-cluster",job="dev-lab-cluster-trivy"}
    values: 0+0x120
  - series: up{cluster="dev-lab-cluster",job="dev-lab-cluster-trivy-reports"}
    values: 0+0x120
  - series: up{cluster="dev-lab-cluster",job="dev-lab-cluster-kube-state-metrics"}
    values: 0+0x120
  promql_expr_test:
  - expr: ALERTS{alertname="TrivyOperatorUnavailable",alertstate="firing",cluster="dev-lab-cluster"}
    eval_time: 60m
    exp_samples: []
  - expr: ALERTS{alertname="TrivyReportMetricsUnavailable",alertstate="firing",cluster="dev-lab-cluster"}
    eval_time: 60m
    exp_samples: []
  - expr: ALERTS{alertname="TrivyImageInventoryUnavailable",alertstate="firing",cluster="dev-lab-cluster"}
    eval_time: 60m
    exp_samples: []
- name: nightly shutdown suppresses availability alerts with missing scrapes
  interval: 1m
  input_series: []
  promql_expr_test:
  - expr: ALERTS{alertname="TrivyOperatorUnavailable",alertstate="firing",cluster="dev-lab-cluster"}
    eval_time: 60m
    exp_samples: []
  - expr: ALERTS{alertname="TrivyReportMetricsUnavailable",alertstate="firing",cluster="dev-lab-cluster"}
    eval_time: 60m
    exp_samples: []
  - expr: ALERTS{alertname="TrivyImageInventoryUnavailable",alertstate="firing",cluster="dev-lab-cluster"}
    eval_time: 60m
    exp_samples: []
- name: boot grace delays persistent failures then preserves normal pending durations
  interval: 1m
  input_series:
  - series: up{cluster="dev-lab-cluster",job="dev-lab-cluster-nodes",instance="node1:9100"}
    values: 1+0x120
  - series: node_boot_time_seconds{cluster="dev-lab-cluster",job="dev-lab-cluster-nodes",instance="node1:9100"}
    values: 0+0x120
  - series: up{cluster="dev-lab-cluster",job="dev-lab-cluster-trivy"}
    values: 0+0x120
  - series: up{cluster="dev-lab-cluster",job="dev-lab-cluster-trivy-reports"}
    values: 0+0x120
