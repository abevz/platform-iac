# /config/roles/cilium_install_helm/tasks/main.yml
---
- name: Install Helm dependencies (curl, gpg)
  ansible.builtin.apt:
    name: ["apt-transport-https", "gpg", "curl"]
    state: present
    update_cache: yes

- name: Add Helm GPG key (Buildkite)
  ansible.builtin.shell:
    cmd: curl -fsSL https://packages.buildkite.com/helm-linux/helm-debian/gpgkey | gpg --dearmor -o /usr/share/keyrings/helm-buildkite.gpg
    creates: /usr/share/keyrings/helm-buildkite.gpg
  changed_when: false

- name: Add Helm repository (Buildkite)
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/usr/share/keyrings/helm-buildkite.gpg] https://packages.buildkite.com/helm-linux/helm-debian/any/ any main"
    state: present
    filename: helm-stable-debian

- name: Install Helm
  ansible.builtin.apt:
    name: helm
    state: present
    update_cache: yes

# --- START: BLOCK FROM cilium.yml ---
- name: Install/Remove Cilium CLI
  ansible.builtin.shell: |
    if [ ! -f "/usr/local/bin/cilium" ]; then
      CILIUM_CLI_VERSION=$(curl -s https://raw.githubusercontent.com/cilium/cilium-cli/main/stable.txt)
      CLI_ARCH=amd64
      if [ "$(uname -m)" = "aarch64" ]; then CLI_ARCH=arm64; fi
      curl -L --fail --remote-name-all https://github.com/cilium/cilium-cli/releases/download/${CILIUM_CLI_VERSION}/cilium-linux-${CLI_ARCH}.tar.gz{,.sha256sum}
      sha256sum --check cilium-linux-${CLI_ARCH}.tar.gz.sha256sum
      tar xzvfC cilium-linux-${CLI_ARCH}.tar.gz /usr/local/bin
      # v--- FIXED: Explicitly remove both files ---v
      rm cilium-linux-${CLI_ARCH}.tar.gz cilium-linux-${CLI_ARCH}.tar.gz.sha256sum
    fi
  args:
    chdir: /tmp
    creates: /usr/local/bin/cilium
  changed_when: false
  when: addon_state == "present"

- name: Install/Remove Hubble CLI
  ansible.builtin.shell: |
    if [ ! -f "/usr/local/bin/hubble" ]; then
      HUBBLE_VERSION=$(curl -s https://raw.githubusercontent.com/cilium/hubble/master/stable.txt)
      HUBBLE_ARCH=amd64
      if [ "$(uname -m)" = "aarch64" ]; then HUBBLE_ARCH=arm64; fi
      curl -L --fail --remote-name-all https://github.com/cilium/hubble/releases/download/$HUBBLE_VERSION/hubble-linux-${HUBBLE_ARCH}.tar.gz{,.sha256sum}
      sha256sum --check hubble-linux-${HUBBLE_ARCH}.tar.gz.sha256sum
      tar xzvfC hubble-linux-${HUBBLE_ARCH}.tar.gz /usr/local/bin
      # v--- FIXED: Explicitly remove both files ---v
      rm hubble-linux-${HUBBLE_ARCH}.tar.gz hubble-linux-${HUBBLE_ARCH}.tar.gz.sha256sum
    fi
  args:
    chdir: /tmp
    creates: /usr/local/bin/hubble
  changed_when: false
  when: addon_state == "present"

- name: Remove Cilium and Hubble CLI
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /usr/local/bin/cilium
    - /usr/local/bin/hubble
  when: addon_state == "absent"
      # --- END: BLOCK FROM cilium.yml ---

- name: Add Cilium Helm repository
  kubernetes.core.helm_repository:
    name: cilium
    repo_url: "{{ cilium_helm_repo_url }}"
    state: present

- name: Read installed Cilium release before upgrading
  kubernetes.core.helm_info:
    name: cilium
    release_namespace: "{{ cilium_namespace }}"
  register: cilium_current_release
  when: addon_state == 'present'

- name: Require consecutive Cilium minor upgrades
  ansible.builtin.assert:
    that:
      - >-
        (cilium_chart_version.split('.')[0] | int) ==
        ((cilium_current_release.status.chart | regex_replace('^cilium-', '')).split('.')[0] | int)
      - >-
        ((cilium_chart_version.split('.')[1] | int) -
        ((cilium_current_release.status.chart | regex_replace('^cilium-', '')).split('.')[1] | int)) | abs <= 1
    fail_msg: >-
      Cilium upgrades must move one minor release at a time. Update the current
      minor to its latest patch, then set cilium_chart_version for each next
      minor separately; do not skip from 1.18 directly to 1.20.
  when:
    - addon_state == 'present'
    - cilium_current_release.status is defined

- name: Install/Remove Cilium CNI (Helm)
  kubernetes.core.helm:
    name: cilium
    chart_ref: cilium/cilium
    chart_version: "{{ cilium_chart_version }}"
    update_repo_cache: true
    release_namespace: "{{ cilium_namespace }}"
    create_namespace: false
    state: "{{ addon_state }}" # <-- USING VARIABLE
    wait: yes
    timeout: 10m
    values:
      upgradeCompatibility: "{{ cilium_upgrade_compatibility }}"
      kubeProxyReplacement: "true"
      k8sServiceHost: "{{ ansible_fqdn }}"
      k8sServicePort: 6443
      bpf:
        masquerade: true
      securityContext:
        privileged: true
      # --- START: BLOCK FROM cilium.yml ---
      operator:
        replicas: 1
        prometheus:
          enabled: true
      hostFirewall:
        enabled: true
      encryption:
        enabled: true
        nodeEncryption: true
        type: wireguard
      policyAuditMode: false
      l7Proxy: true
      hubble:
        relay:
          enabled: true
        ui:
          enabled: true
        metrics:
          enableOpenMetrics: true
          enabled:
            - dns
            - drop
            - tcp
            - flow
            - port-distribution
            - icmp
            - httpV2:exemplars=true;labelsContext=source_ip,source_namespace,source_workload,destination_ip,destination_namespace,destination_workload,traffic_direction
      prometheus:
        enabled: true
      l2announcements:
        enabled: true
      k8sClientRateLimit:
        qps: 20
        burst: 100
# --- END: BLOCK FROM cilium.yml ---
