# config/roles/jenkins_setup/tasks/main.yml
---
# /config/roles/jenkins_setup/tasks/main.yml

- name: Require a real Jenkins external URL
  ansible.builtin.assert:
    that:
      - jenkins_external_url is match('https?://[^/]+/')
      - "'<' not in jenkins_external_url"
    fail_msg: Set primary_domain or jenkins_external_url to the public Jenkins URL.

- name: Wait for apt locks to be released
  ansible.builtin.shell:
    cmd: "while fuser /var/lib/dpkg/lock-frontend >/dev/null 2>&1; do echo 'Waiting for dpkg lock...' && sleep 10; done; while fuser /var/lib/apt/lists/lock >/dev/null 2>&1; do echo 'Waiting for apt lists lock...' && sleep 10; done;"
  args:
    executable: /bin/bash
  when: ansible_os_family == "Debian"
  changed_when: false
  register: wait_for_lock
  until: wait_for_lock.rc == 0
  retries: 18
  delay: 10
  become: yes

- name: Install Docker prerequisites
  ansible.builtin.apt:
    name: ["ca-certificates", "curl", "gnupg"]
    state: present
    update_cache: yes
  become: yes

- name: Add Docker GPG key
  ansible.builtin.get_url:
    url: "https://download.docker.com/linux/{{ ansible_distribution | lower }}/gpg"
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644"
    force: true
  become: yes

- name: Add Docker repository
  ansible.builtin.apt_repository:
    repo: "deb [arch={{ ansible_architecture if ansible_architecture == 'aarch64' else 'amd64' }} signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/{{ ansible_distribution | lower }} {{ ansible_distribution_release }} stable"
    state: present
    filename: docker
  become: yes

- name: Ensure Docker and Docker Compose are installed
  ansible.builtin.apt:
    name: ["docker-ce", "docker-compose-plugin"]
    state: present
    update_cache: yes
  become: yes

- name: Add VM user to docker group
  ansible.builtin.user:
    name: "{{ jenkins_vm_user }}"
    groups: docker
    append: yes
  become: yes

- name: Ensure Jenkins directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  become: yes
  loop:
    - "{{ jenkins_root_dir }}"
    - "{{ jenkins_home_dir }}"
    - "{{ jenkins_home_dir }}/init.groovy.d"

- name: Set owner for jenkins_home
  ansible.builtin.file:
    path: "{{ jenkins_home_dir }}"
    state: directory
    owner: "1000"
    group: "1000"
    recurse: yes
  become: yes

- name: Load or generate Jenkins admin password on control node
  ansible.builtin.set_fact:
    jenkins_admin_password: "{{ lookup('password', jenkins_admin_password_file + ' length=32 chars=ascii_letters,digits') }}"
  delegate_to: localhost
  become: false

- name: Copy Jenkins bootstrap Groovy
  ansible.builtin.template:
    src: "{{ item }}.groovy.j2"
    dest: "{{ jenkins_home_dir }}/init.groovy.d/{{ item }}.groovy"
    mode: "0644"
  become: yes
  notify: Restart Jenkins stack
  loop:
    - bootstrap-security
    - bootstrap-metrics

- name: Copy docker-compose.yml for Jenkins
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ jenkins_root_dir }}/docker-compose.yml"
    mode: "0644"
  become: yes
  notify: Restart Jenkins stack

- name: Start Jenkins (Docker Compose)
  community.docker.docker_compose_v2:
    project_src: "{{ jenkins_root_dir }}"
    state: present
    pull: missing
  become: yes

- name: Check Jenkins Prometheus plugin installation
  ansible.builtin.stat:
    path: "{{ jenkins_home_dir }}/plugins/prometheus.jpi"
  register: jenkins_prometheus_plugin_stat
  become: yes

- name: Install Jenkins Prometheus plugin
  ansible.builtin.command:
    cmd: >-
      docker exec jenkins
      jenkins-plugin-cli
      --latest false
      --plugin-download-directory /var/jenkins_home/plugins
      --plugins {{ jenkins_prometheus_plugin }}
  become: yes
  when: not jenkins_prometheus_plugin_stat.stat.exists
  notify: Restart Jenkins stack

# --- Autostart block ---
- name: Copy systemd unit file for Jenkins
  ansible.builtin.template:
    src: jenkins.service.j2
    dest: /etc/systemd/system/jenkins-compose.service
    mode: "0644"
  become: yes
  notify: Reload systemd

- name: Enable Jenkins service (autostart on boot)
  ansible.builtin.systemd:
    name: jenkins-compose
    enabled: yes
    state: started
  become: yes

- name: Run pending Jenkins restart before checking metrics
  ansible.builtin.meta: flush_handlers

- name: Verify Jenkins Prometheus plugin is serving metrics
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ jenkins_http_port }}{{ jenkins_metrics_endpoint }}"
    status_code: 200
    return_content: true
  register: jenkins_metrics_probe
  until:
    - jenkins_metrics_probe.status | default(0) == 200
    - "'# HELP ' in (jenkins_metrics_probe.content | default(''))"
  retries: 30
  delay: 10
  changed_when: false
