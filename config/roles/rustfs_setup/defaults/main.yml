# config/roles/rustfs_setup/defaults/main.yml
---
# /config/roles/rustfs_setup/defaults/main.yml
rustfs_root_dir: "/srv/rustfs"
rustfs_hostname: "rustfs-server"
rustfs_data_dir: "/srv/rustfs/data"
rustfs_config_dir: "/srv/rustfs/config"

rustfs_image: "rustfs/rustfs:1.0.0-beta.8"
rustfs_logs_dir: "/srv/rustfs/logs"
rustfs_address: "0.0.0.0:9000"
rustfs_console_address: "0.0.0.0:9001"
rustfs_container_uid: "10001"
rustfs_container_gid: "10001"
rustfs_manage_data_ownership: true
