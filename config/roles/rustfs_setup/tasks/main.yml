# config/roles/rustfs_setup/tasks/main.yml
---
# /config/roles/rustfs_setup/tasks/main.yml

- name: Set RustFS guest hostname
  ansible.builtin.hostname:
    name: "{{ rustfs_hostname }}"
  become: true

- name: Preserve the managed hostname and hosts file across cloud-init runs
  ansible.builtin.copy:
    content: "preserve_hostname: true\nmanage_etc_hosts: false\n"
    dest: /etc/cloud/cloud.cfg.d/99-preserve-hostname.cfg
    owner: root
    group: root
    mode: "0644"
  become: true

- name: Resolve the RustFS guest hostname locally
  ansible.builtin.lineinfile:
    path: /etc/hosts
    regexp: '^127\.0\.1\.1\s'
    line: "127.0.1.1 {{ rustfs_hostname }} {{ rustfs_hostname }}"
  become: true

# --- Docker Repository Installation Block ---
- name: Install Docker prerequisites
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
    state: present
    update_cache: yes
  become: yes

- name: Add Docker GPG key (Debian/Ubuntu)
  ansible.builtin.get_url:
    url: "https://download.docker.com/linux/{{ ansible_distribution | lower }}/gpg"
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644"
    force: true
  become: yes

- name: Add Docker repository (Debian/Ubuntu)
  ansible.builtin.apt_repository:
    repo: "deb [arch={{ ansible_architecture if ansible_architecture == 'aarch64' else 'amd64' }} signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/{{ ansible_distribution | lower }} {{ ansible_distribution_release }} stable"
    state: present
    filename: docker
  become: yes
# --- End Docker Repository Block ---

- name: Ensure Docker and Docker Compose are installed
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-compose-plugin
    state: present
    update_cache: yes
  become: yes

- name: Ensure object storage directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  become: yes
  loop:
    - "{{ rustfs_root_dir }}"
    - "{{ rustfs_data_dir }}"
    - "{{ rustfs_config_dir }}"
    - "{{ rustfs_logs_dir }}"

- name: Ensure RustFS can write existing data paths
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ rustfs_container_uid }}"
    group: "{{ rustfs_container_gid }}"
    recurse: true
  become: yes
  loop:
    - "{{ rustfs_data_dir }}"
    - "{{ rustfs_config_dir }}"
    - "{{ rustfs_logs_dir }}"
  when: rustfs_manage_data_ownership | bool

- name: Copy docker-compose.yml for S3-compatible storage
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ rustfs_root_dir }}/docker-compose.yml"
    mode: "0644"
  become: yes
  notify: Restart RustFS

- name: Ensure S3-compatible storage is running (Docker Compose)
  community.docker.docker_compose_v2:
    project_src: "{{ rustfs_root_dir }}"
    state: present
  become: yes
